name: Deploy a vortec-consulting.com (producción)

# Disparo manual únicamente (Actions → este workflow → "Run workflow"):
# esto sube directo a la raíz del dominio, a diferencia de deploy-prueba.yml
# que corre automático en cada push y sube a /prueba.
on:
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          WP_URL: ${{ secrets.WP_URL }}

      - name: Deploy por FTP a la raíz del dominio
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./dist/
          server-dir: ./
          # No borra archivos en el servidor que no estén en dist/ (WordPress
          # headless en /admin, la carpeta /prueba, etc. quedan intactos).
          exclude: |
            /admin/**
            /prueba/**
