name: Deploy a vortec-consulting.com (producción)

# Corre automático en cada push a main (sube a la raíz del dominio) y también
# se puede disparar a mano desde Actions → este workflow → "Run workflow".
on:
  push:
    branches: [main]
  workflow_dispatch:

# Mismo grupo que deploy-prueba.yml: los dos deploys usan la misma cuenta FTP y el
# hosting corta la conexión (ECONNRESET) si corren a la vez, así que se encolan.
concurrency:
  group: ftp-vortec
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          WP_URL: ${{ secrets.WP_URL }}

      - name: Deploy por FTP a la raíz del dominio
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          # FTPS (FTP sobre TLS): con FTP plano el hosting cortaba la conexión
          # (ECONNRESET) a mitad de la subida completa del sitio.
          protocol: ftps
          local-dir: ./dist/
          server-dir: ./
          # No borra archivos en el servidor que no estén en dist/ (WordPress
          # headless en /admin, la carpeta /prueba, etc. quedan intactos).
          exclude: |
            /admin/**
            /prueba/**
