name: Deploy a vortec-consulting.cl/prueba

on:
  push:
    branches: [main]
  workflow_dispatch:

# Mismo grupo que deploy-produccion.yml: se encolan para no usar la cuenta FTP a la vez.
concurrency:
  group: ftp-vortec
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Diagnóstico WP_URL (no expone el valor del secret)
        env:
          WP_URL: ${{ secrets.WP_URL }}
        run: |
          if [ -z "$WP_URL" ]; then
            echo "::warning::El secret WP_URL está vacío o no existe. Las noticias/servicios usarán el fallback estático."
          else
            echo "WP_URL está definido (longitud: ${#WP_URL} caracteres)."
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 10 "$WP_URL/wp-json/wp/v2/posts?per_page=1" || echo "FALLO_CONEXION")
            echo "Respuesta HTTP de $WP_URL/wp-json/wp/v2/posts: $code"
          fi

      - name: Build
        run: npm run build
        env:
          WP_URL: ${{ secrets.WP_URL }}
          BASE_PATH: /prueba

      - name: Deploy por FTP a /prueba
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./dist/
          server-dir: /prueba/
